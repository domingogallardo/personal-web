- title: "Comportamientos coordinados en formaciones de robots usando percepción visual y comunicación punto a punto"
  title_en: "Coordinated behaviors in robot formations using visual perception and point-to-point communication"
  authors: "Antonio Botía, Domingo Gallardo, María I. Alfonso"
  venue: "Actas del VII Workshop de Agentes Físicos (WAF 2006), Las Palmas de Gran Canaria"
  venue_en: "Proceedings of the VII Workshop on Physical Agents (WAF 2006), Las Palmas de Gran Canaria"
  year: 2006
  citation: "Botía, A.; Gallardo, D.; Alfonso, M. I. (2006). Comportamientos coordinados en formaciones de robots usando percepción visual y comunicación punto a punto. En Actas del VII Workshop de Agentes Físicos (WAF’2006), Las Palmas de Gran Canaria (27–28 abr. 2006), pp. 11–18."
  summary: "Propone comportamientos coordinados en formaciones de robots mediante percepción visual y comunicación punto a punto, integrando el control cooperativo de la formación con intercambio local de información entre agentes, para mantener estructuras de movimiento robustas en escenarios dinámicos."
  summary_en: "It proposes coordinated behaviors for robot formations through visual perception and point-to-point communication, integrating cooperative formation control with local information exchange between agents to maintain robust movement structures in dynamic scenarios."
  links:
    pdf: "/papers/botia-gallardo-alfonso-2006-comportamientos-coordinados.pdf"

- title: "Visual homing navigation with two landmarks: The balanced proportional triangulation method"
  authors: "José F. Bonora, Domingo Gallardo"
  venue: "2006 IEEE/RSJ International Conference on Intelligent Robots and Systems (IROS 2006), Beijing"
  year: 2006
  citation: "Bonora, J. F.; Gallardo, D. (2006). Visual homing navigation with two landmarks: The balanced proportional triangulation method. En 2006 IEEE/RSJ International Conference on Intelligent Robots and Systems (IROS 2006), pp. 2289–2295, Beijing (9–15 oct. 2006)."
  summary: "Propone un método de visual homing usando solo dos landmarks, sin brújula ni conocimiento previo de su posición o tamaño real, calculando la ruta al punto home mediante triangulación/trilateración a partir de información angular y del tamaño aparente observado, con trayectorias rectilíneas y eficientes."
  summary_en: "It proposes a visual homing method that uses only two landmarks, without a compass or prior knowledge of their position or real size, computing the route back to the home point through triangulation/trilateration from angular information and observed apparent size, with straight and efficient trajectories."
  links:
    pdf: "/papers/bonora-gallardo-2006-visual-homing-two-landmarks.pdf"

- title: "A genetic algorithm for robust motion planning"
  authors: "Domingo Gallardo, Otto Colomina, Francisco Flórez, Ramón Rizo"
  venue: "11th International Conference on Industrial and Engineering Applications of Artificial Intelligence and Expert Systems (IEA/AIE 1998)"
  year: 1998
  citation: "Gallardo, D.; Colomina, O.; Flórez, F.; Rizo, R. (1998). A genetic algorithm for robust motion planning. En International Conference on Industrial, Engineering and Other Applications of Applied Intelligent Systems, pp. 115–121, Springer Berlin Heidelberg (jun. 1998)."
  summary: "Propone un algoritmo genético para planificar trayectorias robustas y subóptimas en el espacio de velocidades de un robot móvil, introduciendo ruido acumulativo en la evaluación de la función de fitness y ajustes en el propio algoritmo para contemplar esa incertidumbre, con resultados experimentales en distintos entornos y niveles de ruido."
  summary_en: "It proposes a genetic algorithm to plan robust, suboptimal trajectories in the velocity space of a mobile robot, introducing accumulated noise in the evaluation of the fitness function and adjustments to the algorithm itself to account for that uncertainty, with experimental results across different environments and noise levels."
  links:
    pdf: "/papers/gallardo98b-IEAAIE.pdf"

- title: "Estimación bayesiana de características en robots móviles mediante muestreo de la densidad a posteriori"
  title_en: "Bayesian estimation of features in mobile robots by sampling the posterior density"
  authors: "Domingo Gallardo, Francisco Escolano, Otto Colomina, Ramón Rizo, Miguel A. Cazorla"
  venue: "I Congrés Català d'Intel·ligència Artificial, Tarragona"
  venue_en: "1st Catalan Conference on Artificial Intelligence, Tarragona"
  year: 1998
  citation: "Gallardo, D.; Escolano, F.; Rizo, R.; Colomina, O.; Cazorla, M. A. (1998). Estimación bayesiana de características en robots móviles mediante muestreo de la densidad a posteriori. En Butlletí de l’ACIA, Primavera–Estiu 1998 (núms. 14–15), Actes del 1r CCIA, pp. 326–334, Tarragona (21–23 oct. 1998)."
  summary: "Seguimiento robusto de pasillos y finales de pasillo con sonar mediante filtrado bayesiano por partículas (CONDENSATION), capaz de representar posteriors no gaussianas y multimodales, en la misma familia de técnicas que la [Localización Monte Carlo (MCL)](https://robots.stanford.edu/papers/fox.aaai99.pdf)."
  summary_en: "It presents robust tracking of corridors and corridor endings with sonar by means of Bayesian particle filtering (CONDENSATION), capable of representing non-Gaussian and multimodal posteriors, in the same family of techniques as [Monte Carlo Localization (MCL)](https://robots.stanford.edu/papers/fox.aaai99.pdf)."
  links:
    pdf: "/papers/CCIA1998_Estimacion_bayesiana_de_caracteristicas.pdf"

- title: "Navegación en interiores de un robot móvil usando sensores de ultrasonidos"
  title_en: "Indoor navigation of a mobile robot using ultrasonic sensors"
  authors: "Domingo Gallardo"
  venue: "Tesis doctoral, Universidad de Alicante"
  venue_en: "PhD thesis, University of Alicante"
  year: 1999
  summary: "Presenta un enfoque probabilista para estimar la posición y orientación del robot, combina modelos sensoriales de ultrasonidos con representación del entorno interior, y evalúa resultados experimentales de navegación autónoma y robustez ante incertidumbre."
  summary_en: "It presents a probabilistic approach to estimate the robot's position and orientation, combines ultrasonic sensor models with an indoor environment representation, and evaluates experimental results on autonomous navigation and robustness under uncertainty."
  links:
    pdf: "/papers/gallardo-tesis.pdf"

- title: "A Temporal Blackboard Structure for Process Control"
  authors: "F. Barber, V. Botti, A. Crespo, Domingo Gallardo, E. Onaindía"
  venue: "Artificial Intelligence in Real-Time Control 1992 (IFAC Symposia Series, Vol. 6), Pergamon Press"
  year: 1992
  citation: "Barber, F.; Botti, V.; Crespo, A.; Gallardo, D.; Onaindía, E. (1993). A Temporal Blackboard Structure for Process Control. En Artificial Intelligence in Real-Time Control 1992 (IFAC Symposia Series, Vol. 6), Pergamon Press, pp. 459–465."
  summary: "Describe una estructura de blackboard temporal para sistemas expertos en tiempo real aplicada al control de procesos, con un modelo para representar y gestionar información temporal (incluyendo predicción e incertidumbre) y un ejemplo ilustrativo en un proceso industrial."
  summary_en: "It describes a temporal blackboard structure for real-time expert systems applied to process control, with a model to represent and manage temporal information (including prediction and uncertainty) and an illustrative example in an industrial process."
  links:
    pdf: "/papers/barber-botti-crespo-gallardo-onaindia-1993-temporal-blackboard-process-control.pdf"

- title: "Navegación del robot móvil Xavier y participación en la AAAI'93 Mobile Robot Competition"
  title_en: "Navigation of the mobile robot Xavier and participation in the AAAI'93 Mobile Robot Competition"
  authors: "Domingo Gallardo"
  venue: "Carnegie Mellon University (CMU)"
  year: 1993
  summary: "Durante una estancia en CMU he participado en el desarrollo de algoritmos de navegación del robot móvil Xavier y en su participación en la AAAI’93 Mobile Robot Competition; ver [Xavier: An Autonomous Mobile Robot on the Web (PDF)](/papers/xavier-autonomous-mobile-robot-web.pdf), [Lessons Learned from Xavier (PDF)](/papers/lessons-learned-from-xavier.pdf) y el [informe de la competición AAAI’93](https://www.cs.cmu.edu/~xavier/aaai93.html)."
  summary_en: "During a stay at CMU I took part in the development of navigation algorithms for the mobile robot Xavier and in its participation in the AAAI'93 Mobile Robot Competition; see [Xavier: An Autonomous Mobile Robot on the Web (PDF)](/papers/xavier-autonomous-mobile-robot-web.pdf), [Lessons Learned from Xavier (PDF)](/papers/lessons-learned-from-xavier.pdf), and the [AAAI'93 competition report](https://www.cs.cmu.edu/~xavier/aaai93.html)."
