<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="870" viewBox="0 0 1600 870" role="img" aria-labelledby="title desc">
<title id="title">El agente genera instrucciones; los ordenadores remotos ejecutan código</title>
<desc id="desc">En los servidores de OpenAI, un agente formado por un LLM y un harness intercambia peticiones y resultados. El harness envía comandos y pequeños scripts a ordenadores de Hugging Face y recibe resultados. El código remoto no contiene el LLM ni constituye una réplica del agente. Es un esquema conceptual que omite los servicios intermedios de la intrusión.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#637b83" stroke-width="1.6"/></marker>
  <style>
    text { fill: #3f5961; font-family: Georgia, 'Times New Roman', serif; }
    .line { fill:none; stroke:#637b83; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
    .heading { font-size:31px; }
    .label { font-size:25px; }
    .small { font-size:21px; }
  </style>
</defs>
<rect width="1600" height="1000" fill="#faf9f5"/>
<text x="800" y="75" text-anchor="middle" font-size="39">El agente permanece en OpenAI</text>
<text x="800" y="119" text-anchor="middle" font-size="25">Envía instrucciones; otros ordenadores ejecutan el código</text>

<!-- Infraestructura de origen -->
<rect x="55" y="185" width="590" height="650" rx="24" class="line"/>
<text x="350" y="237" text-anchor="middle" class="heading">Servidores de OpenAI</text>
<rect x="80" y="271" width="540" height="530" rx="18" class="line" stroke-dasharray="5 9"/>
<text x="350" y="310" text-anchor="middle" font-size="26">AGENTE = LLM + harness + herramientas</text>

<rect x="140" y="349" width="410" height="127" rx="12" class="line"/>
<g class="line" transform="translate(168 381)">
  <rect x="9" y="9" width="48" height="48" rx="4"/><rect x="20" y="20" width="26" height="26" rx="2"/>
  <path d="M20 0v9 M33 0v9 M46 0v9 M20 57v9 M33 57v9 M46 57v9 M0 20h9 M0 33h9 M0 46h9 M57 20h9 M57 33h9 M57 46h9"/>
</g>
<text x="382" y="399" text-anchor="middle" font-size="32">LLM</text>
<text x="382" y="438" text-anchor="middle" class="small">Genera texto y peticiones</text>

<path d="M267 476 V551" class="line" marker-end="url(#arrow)"/>
<text x="252" y="517" text-anchor="end" class="small">Peticiones</text>
<path d="M447 551 V476" class="line" marker-end="url(#arrow)"/>
<text x="461" y="517" class="small">Contexto</text>

<rect x="140" y="551" width="410" height="151" rx="12" class="line"/>
<g class="line" transform="translate(168 586)">
  <rect width="65" height="52" rx="4"/><path d="M0 13h65 M12 26l9 8-9 8 M29 42h17"/>
</g>
<text x="382" y="596" text-anchor="middle" font-size="31">Harness</text>
<text x="382" y="635" text-anchor="middle" class="small">Llama a las herramientas</text>
<text x="382" y="669" text-anchor="middle" class="small">y devuelve los resultados al LLM</text>

<!-- Infraestructura remota -->
<rect x="970" y="185" width="575" height="650" rx="24" class="line"/>
<text x="1257" y="237" text-anchor="middle" class="heading">Ordenadores de Hugging Face</text>
<g class="line" transform="translate(1180 273)">
 <rect x="0" y="0" width="154" height="40" rx="5"/><rect x="0" y="48" width="154" height="40" rx="5"/>
 <path d="M17 14h72 M17 26h72 M17 62h72 M17 74h72"/><circle cx="127" cy="20" r="4"/><circle cx="127" cy="68" r="4"/>
</g>
<text x="1257" y="405" text-anchor="middle" class="label">Código recibido e instalado</text>
<rect x="1010" y="441" width="495" height="238" rx="12" class="line"/>
<text x="1257" y="486" text-anchor="middle" font-size="28">Comandos y pequeños scripts</text>
<path d="M1050 512 H1465" class="line" stroke-width="1.4"/>
<text x="1257" y="551" text-anchor="middle" class="label">Listar un directorio</text>
<text x="1257" y="596" text-anchor="middle" class="label">Buscar un texto en archivos</text>
<text x="1257" y="641" text-anchor="middle" class="label">Ejecutar instrucciones programadas</text>

<!-- Intercambio por red: solo instrucciones y resultados -->
<path d="M550 575 H1010" class="line" marker-end="url(#arrow)"/>
<rect x="662" y="469" width="290" height="76" rx="8" fill="#faf9f5"/>
<text x="803" y="496" text-anchor="middle" class="label">Comandos y scripts</text>
<text x="803" y="528" text-anchor="middle" class="small">enviados por red</text>
<path d="M1010 655 H550" class="line" marker-end="url(#arrow)"/>
<text x="795" y="696" text-anchor="middle" class="small">Resultados de ejecución</text>

</svg>