include /etc/nginx/modules/*.conf;

user nginx;

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Host-mounted writable area (PUT + BasicAuth for write methods).
        location /data/ {
            alias /data/;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            autoindex on;
            create_full_put_path on;
            dav_methods PUT;
            dav_access user:rw group:r all:r;

            limit_except GET HEAD {
                auth_basic "Protected editing";
                auth_basic_user_file /etc/nginx/.htpasswd;
            }
        }

        location = /read {
            return 301 /read/;
        }
        location /read/ {
            alias /usr/share/nginx/html/read/;
            index read.html index.html;
            try_files $uri $uri/ =404;
            autoindex off;
        }
        location = /read/tweets/read.html {
            return 301 /read/;
        }

        location = /papers {
            return 301 /papers/;
        }
        location /papers/ {
            alias /usr/share/nginx/html/papers/;
            index index.html;
            try_files $uri $uri/ =404;
        }

        location / {
            try_files $uri $uri/ =404;
        }

        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
    }
}
