<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1370" viewBox="0 0 1600 1370" role="img" aria-labelledby="title desc">
<title id="title">Un agente usa herramientas a través de un harness</title>
<desc id="desc">El harness está encima del LLM y controla el ciclo: envía contexto al modelo, recibe la salida generada y ejecuta peticiones de herramientas. A la derecha, cada herramienta tiene agrupados sus ejemplos de petición y resultado: debajo del navegador y encima del lector de correo. Las conexiones al exterior salen del navegador hacia una página web y del lector de correo hacia el servidor de correo.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#637b83" stroke-width="1.6"/></marker>
<style>
text { fill:#3f5961; font-family:Georgia,'Times New Roman',serif; }
.line { fill:none; stroke:#637b83; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
.small { font-size:22px; } .code { font-family:Menlo,monospace; font-size:18px; }
</style>
</defs>
<rect width="1600" height="1370" fill="#faf9f5"/>
<text x="800" y="64" text-anchor="middle" font-size="39">Un agente: modelo, harness y herramientas</text>
<text x="800" y="108" text-anchor="middle" font-size="25">El harness controla el ciclo; las herramientas conectan con el exterior</text>

<rect x="45" y="280" width="1510" height="920" rx="24" class="line" stroke-dasharray="5 9"/>
<text x="80" y="319" font-size="25">AGENTE</text>

<!-- Harness arriba; LLM debajo -->
<text x="325" y="406" text-anchor="middle" font-size="24" font-style="italic">Ciclo controlado por el harness</text>
<rect x="100" y="440" width="450" height="180" rx="12" class="line"/>
<text x="325" y="488" text-anchor="middle" font-size="34">Harness</text>
<text x="325" y="530" text-anchor="middle" class="small">Detecta peticiones completas</text>
<text x="325" y="566" text-anchor="middle" class="small">3. Ejecuta la herramienta</text>
<text x="325" y="601" text-anchor="middle" class="small">4. Incorpora el resultado al contexto</text>

<rect x="100" y="905" width="450" height="160" rx="12" class="line"/>
<g class="line" transform="translate(130 930)"><rect x="9" y="9" width="48" height="48" rx="4"/><rect x="20" y="20" width="26" height="26" rx="2"/><path d="M20 0v9 M33 0v9 M46 0v9 M20 57v9 M33 57v9 M46 57v9 M0 20h9 M0 33h9 M0 46h9 M57 20h9 M57 33h9 M57 46h9"/></g>
<text x="345" y="962" text-anchor="middle" font-size="34">LLM</text>
<text x="325" y="1007" text-anchor="middle" class="small">Genera texto y peticiones</text>
<text x="325" y="1042" text-anchor="middle" class="small">a partir del contexto</text>

<path d="M200 620 V905" class="line" marker-end="url(#arrow)"/>
<text x="180" y="748" text-anchor="end" font-size="22">1. Envía</text>
<text x="180" y="780" text-anchor="end" font-size="22">contexto</text>
<path d="M450 905 V620" class="line" marker-end="url(#arrow)"/>
<text x="473" y="748" font-size="22">2. Recibe</text>
<text x="473" y="780" font-size="22">la salida generada</text>

<!-- Herramientas -->
<rect x="1000" y="335" width="460" height="135" rx="12" class="line"/>
<g class="line" transform="translate(1030 365)"><rect width="65" height="48" rx="4"/><path d="M0 13h65 M11 6h1 M21 6h1 M31 6h1"/></g>
<text x="1275" y="386" text-anchor="middle" font-size="31">Navegador</text>
<text x="1230" y="439" text-anchor="middle" class="small">Abre la URL y lee la página</text>

<rect x="1000" y="1040" width="460" height="125" rx="12" class="line"/>
<g class="line" transform="translate(1030 1066)"><rect width="65" height="44" rx="3"/><path d="M2 3l30 24L63 3"/></g>
<text x="1280" y="1085" text-anchor="middle" font-size="30">Lector de correo</text>
<text x="1230" y="1135" text-anchor="middle" class="small">Consulta los mensajes</text>

<!-- Ejemplos agrupados por herramienta -->
<rect x="830" y="495" width="680" height="240" rx="12" fill="#f1f2ed" stroke="#637b83" stroke-width="1.5"/>
<text x="856" y="528" font-size="22">Petición generada por el LLM</text>
<text x="856" y="562" class="code">{"herramienta": "navegador",</text>
<text x="856" y="589" class="code"> "argumentos": {"url": "https://ejemplo.org"}}</text>
<path d="M856 610 H1484" class="line" stroke-width="1"/>
<text x="856" y="642" font-size="22">Resultado devuelto al harness</text>
<text x="856" y="677" class="code">{"herramienta": "navegador",</text>
<text x="856" y="704" class="code"> "resultado": {"texto": "Contenido de la página…"}}</text>

<rect x="830" y="775" width="680" height="240" rx="12" fill="#f1f2ed" stroke="#637b83" stroke-width="1.5"/>
<text x="856" y="808" font-size="22">Petición generada por el LLM</text>
<text x="856" y="842" class="code">{"herramienta": "correo",</text>
<text x="856" y="869" class="code"> "argumentos": {"carpeta": "Entrada", "limite": 1}}</text>
<path d="M856 890 H1484" class="line" stroke-width="1"/>
<text x="856" y="922" font-size="22">Resultado devuelto al harness</text>
<text x="856" y="957" class="code">{"herramienta": "correo",</text>
<text x="856" y="984" class="code"> "resultado": [{"asunto": "Reunión del viernes"}]}</text>

<!-- Llamada a cada herramienta y devolución del resultado -->
<path d="M550 490 H745 V402 H1000" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<path d="M550 565 H745 V1102 H1000" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

<!-- Servicios externos -->
<rect x="1070" y="163" width="330" height="92" rx="12" class="line"/>
<text x="1235" y="201" text-anchor="middle" font-size="28">Página web</text>
<text x="1235" y="235" text-anchor="middle" class="small">ejemplo.org</text>
<path d="M1235 255 V335" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect x="1270" y="270" width="245" height="54" fill="#faf9f5"/>
<text x="1285" y="290" font-size="18">Petición web</text>
<text x="1285" y="314" font-size="18">y contenido</text>

<rect x="1070" y="1260" width="330" height="92" rx="12" class="line"/>
<text x="1235" y="1298" text-anchor="middle" font-size="27">Servidor de correo</text>
<text x="1235" y="1332" text-anchor="middle" class="small">Mensajes de la cuenta</text>
<path d="M1235 1165 V1260" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect x="1270" y="1197" width="245" height="54" fill="#faf9f5"/>
<text x="1285" y="1217" font-size="18">Consulta</text>
<text x="1285" y="1241" font-size="18">y mensajes</text>
</svg>